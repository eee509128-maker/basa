<!-- Auth Modal: Login & Registration -->
<div id="authModal" class="basa-modal-overlay" style="display: none;">
  <div class="basa-modal-container" style="max-width: 440px;">
    <div class="basa-modal-header" style="border-bottom: none; padding-bottom: 0;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img src="/assets/logo.png" alt="آزمایشگاه باسا" style="height: 44px; width: auto; object-fit: contain;">
        <div>
          <h3 id="authModalTitle" style="margin: 0; font-size: 1.15rem; color: #1e293b; font-weight: 800;">حساب کاربری آزمایشگاه باسا</h3>
          <p style="margin: 0; font-size: 0.78rem; color: #64748b;">ورود و ثبت‌نام سریع مشتریان</p>
        </div>
      </div>
      <button onclick="window.closeAuthModal()" class="basa-modal-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Auth Tabs -->
    <div style="display: flex; border-bottom: 2px solid #e2e8f0; margin: 15px 24px 0;">
      <button type="button" id="tabAuthLogin" onclick="window.switchAuthTab('login')" style="flex: 1; padding: 12px; background: none; border: none; font-size: 0.95rem; font-weight: bold; color: #f97316; border-bottom: 2px solid #f97316; margin-bottom: -2px; cursor: pointer;">
        ورود به سامانه
      </button>
      <button type="button" id="tabAuthRegister" onclick="window.switchAuthTab('register')" style="flex: 1; padding: 12px; background: none; border: none; font-size: 0.95rem; font-weight: bold; color: #64748b; margin-bottom: -2px; cursor: pointer;">
        ثبت‌نام مشتری جدید
      </button>
    </div>

    <div class="basa-modal-body" style="padding: 24px;">
      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="window.handleLoginSubmit(event)">
        <div style="margin-bottom: 16px;">
          <label class="form-label">شماره موبایل یا نام کاربری *</label>
          <input type="text" id="loginUsername" required placeholder="شماره موبایل خود را وارد کنید" class="basa-input" style="direction: ltr; text-align: right;">
        </div>

        <div style="margin-bottom: 24px;">
          <label class="form-label">رمز عبور *</label>
          <input type="password" id="loginPassword" required placeholder="رمز عبور خود را وارد کنید" class="basa-input" style="direction: ltr; text-align: left;">
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: bold; font-size: 1rem; border-radius: 10px; background: linear-gradient(135deg, #f97316, #ea580c);">
          ورود به حساب کاربری
        </button>
      </form>

      <!-- REGISTER FORM (Clean for Customers: Only Name, Mobile, Password) -->
      <form id="registerForm" onsubmit="window.handleRegisterSubmit(event)" style="display: none;">
        <div style="margin-bottom: 16px;">
          <label class="form-label">نام و نام خانوادگی *</label>
          <input type="text" id="regFullName" required placeholder="نام و نام خانوادگی خود را وارد کنید" class="basa-input">
        </div>

        <div style="margin-bottom: 16px;">
          <label class="form-label">شماره تلفن همراه *</label>
          <input type="tel" id="regMobile" required placeholder="09123456789" class="basa-input" style="direction: ltr; text-align: right;">
        </div>

        <div style="margin-bottom: 24px;">
          <label class="form-label">رمز عبور دلخواه *</label>
          <input type="password" id="regPassword" required placeholder="حداقل ۶ کاراکتر" class="basa-input" style="direction: ltr; text-align: left;">
        </div>

        <button type="submit" id="btnRegSubmit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: bold; font-size: 1rem; border-radius: 10px; background: linear-gradient(135deg, #10b981, #059669);">
          ثبت‌نام و ورود به حساب
        </button>
      </form>

      <div id="authErrorMessage" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 0.85rem; text-align: center;"></div>
    </div>
  </div>
</div>
